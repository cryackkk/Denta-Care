<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход для администратора - Denta Care</title>
    <link rel="stylesheet" href="style.css?v=20260622">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo-left">
        <img src="img/logo.png" class="logo-img">
        <div class="nazvanie">
            <p>DENTA CARE</p>
            Irish Dental Clinic - Admin
        </div>
    </div>
    <div class="header-buttons">
        <a href="index.html" class="glavnaya-button">На главную</a>
    </div>
  </div>
</header>

<main>
    <div class="registration-container">
        <h1>🔐 Вход для администратора</h1>
        <p class="registration-subtitle">Панель управления клиникой</p>
        
        <form id="adminLoginForm" class="registration-form" onsubmit="handleAdminLogin(event)">
            
            <div class="form-group">
                <label for="login">Логин администратора</label>
                <input type="text" id="login" name="login" required placeholder="admin" autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required placeholder="Пароль администратора">
            </div>
            
            <button type="submit" class="submit-button">Войти в панель управления</button>
            
        </form>
    </div>
</main>

<footer class="footer">
   <div class="footer-content">
      <p>© 2026 Denta Care</p>
      <p>Алматы | +7 700 000 0000</p>
   </div>
</footer>

<script src="js/admin-login.js?v=20260622"></script>

</body>
</html>
