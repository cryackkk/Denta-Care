<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Denta Care</title>
    <link rel="stylesheet" href="style.css?v=20260622">
</head>
<body>

<header class="header">
  <div class="header-inner">

    <div class="logo-left">
        <img src="img/logo.png" class="logo-img">
        <div class="nazvanie">
            <p>DENTA CARE</p>
            Irish Dental Clinic
        </div>
    </div>

    <div class="header-buttons" id="header-buttons">
        <a href="index.html" class="glavnaya-button">Главная</a>
        <a href="about.html" class="about-button">О проекте</a>
        <a href="staff.html" class="section-button">Прочий персонал</a>
    </div>

  </div>
</header>

<main>
    <div class="registration-container">
        <h1>Вход в аккаунт</h1>
        <p class="registration-subtitle">Войдите для записи на приём</p>
        
        <form id="loginForm" class="registration-form" onsubmit="handleLogin(event)">
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="example@mail.com">
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required placeholder="Ваш пароль">
            </div>
            
            <button type="submit" class="submit-button">Войти</button>
            
            <div class="form-footer">
                Нет аккаунта? <a href="registration.html" class="link">Зарегистрироваться</a>
            </div>
        </form>
    </div>
</main>

<footer class="footer">
   <div class="footer-content">
      <p>© 2026 Denta Care</p>
      <p>Алматы | +7 700 000 0000</p>
   </div>
</footer>

<script src="js/auth.js?v=20260622"></script>
<script src="js/login.js?v=20260622"></script>

</body>
</html>
