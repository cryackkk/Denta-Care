<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Denta Care</title>
    <link rel="stylesheet" href="style.css?v=20260622">
</head>
<body>

<header class="header">
  <div class="header-inner">

    <div class="logo-left">
        <img src="img/logo.png" class="logo-img">
        <div class="nazvanie">
            <p>DENTA CARE</p>
            Irish Dental Clinic
        </div>
    </div>

    <div class="header-buttons" id="header-buttons">
        <a href="index.html" class="glavnaya-button">Главная</a>
        <a href="about.html" class="about-button">О проекте</a>
        <a href="staff.html" class="section-button">Прочий персонал</a>
    </div>

  </div>
</header>

<main>
    <div class="registration-container">
        <h1>Регистрация</h1>
        <p class="registration-subtitle">Создайте аккаунт для онлайн записи</p>
        
        <form id="registrationForm" class="registration-form" onsubmit="handleRegistration(event)">
            
            <div class="form-group">
                <label for="fullname">Ф.И.О.</label>
                <input type="text" id="fullname" name="fullname" required placeholder="Иванов Иван Иванович">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="example@mail.com">
            </div>
            
            <div class="form-group">
                <label for="phone">Телефон</label>
                <input type="tel" id="phone" name="phone" required placeholder="+7 (___) ___-__-__" pattern="\+7\s?\(?\d{3}\)?\s?\d{3}-?\d{2}-?\d{2}">
            </div>
            
            <div class="form-group">
                <label for="birthdate">Дата рождения</label>
                <input type="date" id="birthdate" name="birthdate" required>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required minlength="6" placeholder="Минимум 6 символов">
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Подтвердите пароль</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="6" placeholder="Повторите пароль">
            </div>
            
            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" required>
                    Я согласен с <a href="#" class="link">политикой конфиденциальности</a>
                </label>
            </div>
            
            <button type="submit" class="submit-button">Зарегистрироваться</button>
            
            <div class="form-footer">
                Уже есть аккаунт? <a href="login.html" class="link">Войти</a>
            </div>
        </form>
    </div>
</main>

<footer class="footer">
   <div class="footer-content">
      <p>© 2026 Denta Care</p>
      <p>Алматы | +7 700 000 0000</p>
   </div>
</footer>

<script src="js/auth.js?v=20260622"></script>
<script src="js/registration.js?v=20260622"></script>

</body>
</html>
